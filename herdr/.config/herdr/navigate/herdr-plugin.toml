id = "dotfiles.navigate"
name = "Navigate"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Ctrl-h/j/k/l: move focus, or pass the key to Neovim, Vim, fzf or fish"
platforms = ["macos"]  # /bin/dash, on every macOS since 10.15; herdr runs here only

# config.base.toml binds Ctrl-h/j/k/l to these actions. Herdr starts a plugin
# action's command itself, in this folder, with the focused pane in
# HERDR_PANE_ID; a `shell` binding is a login shell (`/bin/sh -lc`), which
# reads ~/.profile on every press. dash, not macOS's /bin/sh (bash): it
# starts about 2 ms sooner. Link it once: `herdr plugin link
# ~/.config/herdr/navigate`.

[[actions]]
id = "left"
title = "focus left, or pass to Neovim"
contexts = ["global"]
command = ["/bin/dash", "../scripts/navigate.sh", "left"]

[[actions]]
id = "down"
title = "focus down, or pass to Neovim or fish"
contexts = ["global"]
command = ["/bin/dash", "../scripts/navigate.sh", "down"]

[[actions]]
id = "up"
title = "focus up, or pass to Neovim or fish"
contexts = ["global"]
command = ["/bin/dash", "../scripts/navigate.sh", "up"]

[[actions]]
id = "right"
title = "focus right, or pass to Neovim"
contexts = ["global"]
command = ["/bin/dash", "../scripts/navigate.sh", "right"]
