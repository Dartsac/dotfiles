# Source for config.toml. Herdr reads config.toml, which theme-sync (repository
# root) writes from this file with each color name in double braces replaced by
# that Dracula PRO color. Edit this file, then run theme-sync. Color values
# do not belong here.
onboarding = false

# Standalone Herdr profile based on ~/.config/tmux/tmux.conf.
# Run directly in Ghostty: an outer tmux would intercept these shortcuts.
[theme]
name = "dracula"
auto_switch = false

# Dracula Pro, in three layers and three accents.
#
# Layers, each a clear step in lightness from the next:
#   chrome   the sidebar and the tab bar, one near-black surface (bgdarker)
#            that frames the work on two sides
#   canvas   the panes, on Ghostty's own background
#   active   the entry and tab you are on, lighter than the chrome
# Accents, one job each: orange is where you are (active tab, focused pane
# border), purple is structure (panel headers, controls, other panes'
# borders), red is something that needs you.
#
# Names are palette.md's terminal colors plus the Vim theme's bg shades, for
# the variant Ghostty uses.
[theme.custom]
sidebar_bg = "{{bgdarker}}"
# The active entry stands well clear of the chrome; the keyboard cursor is
# lighter again, so the two never look alike.
active_row_bg = "{{bglight}}"
selection_bg = "{{selection}}"
# The tab bar is the same surface as the sidebar. Inactive tabs sit one step
# up from it; dividers and the sidebar's edge are a quiet line.
panel_bg = "{{bgdarker}}"
surface0 = "{{bgdark}}"
surface1 = "{{bglighter}}"
surface_dim = "{{bglighter}}"
# Cream primary text; Ghostty's softer selection foreground for inactive names.
text = "{{foreground}}"
subtext0 = "{{dim_white}}"
overlay1 = "{{dim_white}}"
# Structure: the "spaces" and "agents" headers, new/menu, and the borders of
# panes you are not in. Do not reuse it as a row background.
overlay0 = "{{purple}}"
# Cool branch labels.
mauve = "{{bright_blue}}"
# Warm focus against cool surfaces. Herdr shares this with focused borders.
accent = "{{orange}}"
peach = "{{orange}}"
# Status colors. Herdr draws idle in green, working in yellow, blocked in red
# and done in teal. Idle and working are the everyday states, so they take the
# palette's dim variants and stay in the background; blocked and done are the
# ones to notice and keep the full colors.
green = "{{dim_green}}"
yellow = "{{dim_yellow}}"
red = "{{red}}"
blue = "{{bright_blue}}"
teal = "{{cyan}}"

[terminal]
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+t"
detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

split_vertical = "prefix+|"
split_horizontal = "prefix+_"

# Direct Ctrl-h/j/k/l are custom commands below: like vim-tmux-navigator,
# they reach Neovim when it is focused and move herdr's focus otherwise.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

move_tab_previous = "ctrl+shift+left"
move_tab_next = "ctrl+shift+right"
rename_tab = "prefix+comma"
rename_workspace = "prefix+$"

# Free g for lazygit and o for Finder; retain the displaced Herdr actions.
goto = "prefix+f"
# Step through the Agents sidebar, which is sorted with agents that need you first.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
open_notification_target = "prefix+shift+o"
cycle_pane_next = "prefix+tab"
# prefix+e closes the other panes in the tab, as in tmux (command below).
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = 'python3 "$HOME/.config/herdr/scripts/project-picker.py"'
description = "find a project; open or focus its workspace"
width = "100%"
height = "100%"

[[keys.command]]
key = ["prefix+g", "prefix+ctrl+g"]
type = "popup"
command = "lazygit"
description = "lazygit in the focused pane directory"
width = "100%"
height = "100%"

# herdr-reviewr (persiyanov/herdr-reviewr): review the agent's diff in a split
# and send line comments back to it.
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review pane on/off (agent's diff)"

# herdr-pluck (rmarganti/herdr-pluck): tmux-fingers-style hints over the pane.
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "copy something on screen (hash, path, URL...)"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "open a URL shown on screen"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = 'python3 "$HOME/.config/herdr/faces/faces.py" pick'
description = "choose the sidebar character (Byte, Wisp, Bit or mixed)"
width = 100
height = 11

[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'open "${HERDR_ACTIVE_PANE_CWD:-$PWD}"'
description = "open the focused pane directory in Finder"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = 'sh "$HOME/.config/herdr/scripts/close-other-panes.sh"'
description = "close every other pane in this tab"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'exec sh "$HOME/.config/herdr/scripts/navigate.sh" left'
description = "focus left, or pass to Neovim"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'exec sh "$HOME/.config/herdr/scripts/navigate.sh" down'
description = "focus down, or pass to Neovim"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'exec sh "$HOME/.config/herdr/scripts/navigate.sh" up'
description = "focus up, or pass to Neovim"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'exec sh "$HOME/.config/herdr/scripts/navigate.sh" right'
description = "focus right, or pass to Neovim"

[ui]
# Match the 30-column Neovim tree; leave room for project and branch names.
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 36
# Agents panel as a queue: blocked agents first, then working, then idle.
agent_panel_sort = "priority"
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
# Borders only in split view; a lone pane has none. The focused pane's frame
# uses the peach accent. Herdr 0.9.5 can't hide unfocused frames separately.
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true
pane_scrollbars = false
# No titles on borders: the sidebar and tab names already say what runs where.
show_agent_labels_on_pane_borders = false
tab_bar_position = "bottom"
# tmux's `#h` is the short hostname; Herdr's `hostname` entry is the full one.
# The command runs on the server, so `herdr --remote` still shows that machine.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "hostname -s", interval_seconds = 3600, timeout_seconds = 2 },
]
window_title = "{terminal_title}"
# Accent is defined once in [theme.custom]; ui.accent is a legacy fallback.
# Agent states as distinct shapes as well as colors (chosen in Settings). The
# expanded sidebar shows the faces plugin's characters instead; these marks
# remain in the collapsed sidebar.
status_indicators = "symbols"

# Both panels use one entry shape, so they read as one list:
#   line 1  a little character showing the state, then the name you scan for
#   line 2  where it is, at normal weight, starting under the name
#   line 3  only for something to act on, also under the name
# and one blank line between entries.
#
# All three lines are tokens that the faces plugin in this directory keeps
# current for every agent pane and workspace ($face, $detail, $note or $alert). Herdr
# cannot do it alone: it puts its " · " divider after every token except its
# own status mark, so character and name must be one token; and it starts
# lines 2 and 3 a fixed two cells in, so they carry their own blank cells to
# reach the name. If the plugin is not running the entries are empty:
# `herdr plugin action invoke dotfiles.faces.start`.
#
# Color means two separate things:
#   The character alone shows the state, in the state's color:
#     asleep gray   ready yellow   working cyan   needs you red   done green
#     unknown violet
#   Ready is the plugin's own state: idle in Herdr's terms, but at work within
#   the last ten minutes (`faces.py awake <minutes>`). After that it sleeps.
#   All the text of a space and of its agents has that workspace's color, so
#   an agent is matched to its space at a glance.
# Fifteen Dracula PRO colors and mixes identify workspaces, none of them a
# state color. They are handed out in order: one per hue family first (violet,
# blue, orange, green, pink, cream), then lighter versions, then look-alikes
# and darker versions, so similar colors meet only when many spaces are open.
# Duplicate labels are moved to unused slots while any are free.
# An invisible zero-width prefix chooses the hue (faces/identity.py).
# Byte and Wisp paint their own state colors via Herdr Sprites Pixel, beside
# the differently colored text. Its integer bitmap grid avoids seams between
# tiles. theme-sync generates this font outside git. Bit is ordinary text, so
# it takes the workspace's color like the name beside it.
# `faces.py rules` prints the token definitions; tests check they match.
#
# Nothing uses the terminal's dim attribute, which Ghostty draws at half
# opacity. Line 1 is bold, the others are the same hue at normal weight.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  [{ token = "$face", fg = "{{foreground}}", bold = true, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_blue+cyan:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{cyan+bgdark:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground+orange:50}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_white+bright_blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_cyan+blue:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_magenta+bright_white:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060", fg = "{{magenta+foreground:15}}" },
    { starts_with = "\u2060\u2060\u2060\u2060", fg = "{{dim_green}}" },
    { starts_with = "\u2060\u2060\u2060", fg = "{{orange}}" },
    { starts_with = "\u2060\u2060", fg = "{{blue+cyan:50}}" },
    { starts_with = "\u2060", fg = "{{blue+bright_white:33}}" },
  ] }],
  # "main ↑1 · 3 changed": the branch as the faces plugin reads it, and the
  # count from the git-changes plugin in this directory.
  [{ token = "$detail", fg = "{{comment+foreground:55}}", bold = false, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_blue+cyan:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{cyan+bgdark:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground+orange:50}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_white+bright_blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_cyan+blue:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_magenta+bright_white:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060", fg = "{{magenta+foreground:15}}" },
    { starts_with = "\u2060\u2060\u2060\u2060", fg = "{{dim_green}}" },
    { starts_with = "\u2060\u2060\u2060", fg = "{{orange}}" },
    { starts_with = "\u2060\u2060", fg = "{{blue+cyan:50}}" },
    { starts_with = "\u2060", fg = "{{blue+bright_white:33}}" },
  ] }],
]

[ui.sidebar.agents]
row_gap = 1
# One layout for every agent, whatever harness runs it. Line 3 is the activity
# that the dotfiles Pi reporter sets, passed on by the faces plugin only when
# it says more than the face does: as $alert, in bold, when it needs you, and
# otherwise as $note. Only one of the two is ever set, and Herdr leaves out a
# row with nothing in it. state_text is left out: pi-subagents puts an emoji
# in it.
# Then a Pi parent's subagents as a tree, one row each ($tree1-$tree6, the last
# "+N more" when there are more): `├── <face> reviewer`, under the name like
# line 2, in the same color; only each child's face has its state's color.
# Other agents have no tree rows, so Herdr leaves them out.
rows = [
  [{ token = "$face", fg = "{{foreground}}", bold = true, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_blue+cyan:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{cyan+bgdark:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground+orange:50}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_white+bright_blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_cyan+blue:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_magenta+bright_white:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060", fg = "{{magenta+foreground:15}}" },
    { starts_with = "\u2060\u2060\u2060\u2060", fg = "{{dim_green}}" },
    { starts_with = "\u2060\u2060\u2060", fg = "{{orange}}" },
    { starts_with = "\u2060\u2060", fg = "{{blue+cyan:50}}" },
    { starts_with = "\u2060", fg = "{{blue+bright_white:33}}" },
  ] }],
  [{ token = "$detail", fg = "{{comment+foreground:55}}", bold = false, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_blue+cyan:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{cyan+bgdark:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground+orange:50}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_white+bright_blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_cyan+blue:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_magenta+bright_white:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060", fg = "{{magenta+foreground:15}}" },
    { starts_with = "\u2060\u2060\u2060\u2060", fg = "{{dim_green}}" },
    { starts_with = "\u2060\u2060\u2060", fg = "{{orange}}" },
    { starts_with = "\u2060\u2060", fg = "{{blue+cyan:50}}" },
    { starts_with = "\u2060", fg = "{{blue+bright_white:33}}" },
  ] }],
  [{ token = "$note", fg = "{{comment+foreground:55}}", bold = false, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_blue+cyan:40}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{cyan+bgdark:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground+orange:50}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_white+bright_blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_cyan+blue:25}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_magenta+bright_white:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{foreground}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060", fg = "{{magenta+foreground:15}}" },
    { starts_with = "\u2060\u2060\u2060\u2060", fg = "{{dim_green}}" },
    { starts_with = "\u2060\u2060\u2060", fg = "{{orange}}" },
    { starts_with = "\u2060\u2060", fg = "{{blue+cyan:50}}" },
    { starts_with = "\u2060", fg = "{{blue+bright_white:33}}" },
  ] }],
  [{ token = "$alert", fg = "{{foreground}}", bold = true, dim = false, rules = [
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{green+dim_black:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{bright_blue+blue:33}}" },
    { starts_with = "\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060\u2060", fg = "{{dim_cyan+green:40}}" },
