# Copy to tmux.local.conf (git ignores it) and keep what applies. tmux.conf
# sources it after its own settings and before the plugins load, so a setting
# here wins over tmux.conf's and can be a plugin's option. Only the plugins
# themselves and the keys that save and restore sessions (prefix C-s and C-r)
# come after it. Reload with prefix r.

# A frame around every pane (tmux-pane-clarity's always mode). Needs tmux 3.8,
# Rust (cargo, to build its layout engine on first load) and Python 3.8.
# set -g @pane_clarity_mode 'always'

# Colors: set any of tmux.conf's "Colors" settings again, for example
# set -g pane-active-border-style "fg=#50fa7b"
