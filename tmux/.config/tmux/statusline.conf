# vim: ft=tmux
set -g mode-style "fg=#f8f8f2,bg=#BD93F9"

set -g message-style "fg=#f8f8f2,bg=#BD93F9"
set -g message-command-style "fg=#f8f8f2,bg=#BD93F9"

# set -g pane-border-style "fg=#BD93F9"
# set -g pane-active-border-style "fg=#f8f8f2"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#REDACTED,bg=#BD93F9"

set -g status-bg "#3c3040"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#BD93F9,bg=#f8f8f2,bold] #S #[fg=#f8f8f2,bg=#REDACTED,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#REDACTED,bold] #(whoami) #[fg=#REDACTED,bg=#3c3040]"
set -g status-right "#[fg=#REDACTED,bg=#3c3040,nobold,nounderscore,noitalics]#[fg=#REDACTED,bg=#REDACTED]#[fg=#REDACTED,bg=#REDACTED,nobold,nounderscore,noitalics]#[fg=#REDACTED,bg=#REDACTED]#[fg=#REDACTED,bg=#REDACTED,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#REDACTED,bold] #h "

setw -g window-status-activity-style "underscore,fg=#3F3042,bg=#3c3040"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#f8f8f2,bg=#3c3040"

setw -g window-status-format '#[fg=#3c3040,bg=#3c3040]#[default] #I  #{window_name} #[fg=#3c3040,bg=#3c3040,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=#3c3040,bg=#f8f8f2]#[fg=#REDACTED,bg=#f8f8f2] #I #[fg=#f8f8f2,bg=#REDACTED] #{window_name} #[fg=#REDACTED,bg=#3c3040,nobold]'


