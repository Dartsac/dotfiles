# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Use the terminal's palette instead of tmux 3.8's automatic light/dark theme.
set -s theme terminal

# Keep the active window highlight without tmux 3.8's default underline.
set -g window-status-current-style none

# Show Pi's symbol and optional session name, omitting its " - <directory>"
# suffix when the title has one.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m:π*,#{pane_title}},#{?#{==:#{=/-#{e|+:#{w:#{b:pane_current_path}},3}/:pane_title}, - #{b:pane_current_path}},#{=/#{e|-:#{w:pane_title},#{e|+:#{w:#{b:pane_current_path}},3}}/:pane_title},#{pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}'

# Set terminal to support true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*-ghostty:Tc"

# Reduce escape-time for faster command sequence
set -sg escape-time 10

# Enable mouse support
set -g mouse on

# Set scrollback buffer size
set -g history-limit 50000

# Clipboard
set -g set-clipboard on

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'Dartsac/tmux-pane-clarity'
# Complete frames around every pane; use 'zoom' to retain native tiled splits.
set -g @pane_clarity_mode 'always'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Every save and restore goes through scripts/resurrect_save.py, which keeps
# them apart (see there). resurrect binds no keys and continuum's own autosave
# is off: on every config reload both would briefly run resurrect's scripts
# directly. The wrapper autosaves instead, every:
set -g @resurrect-autosave-interval '1'
set -g @continuum-save-interval '0'
set -g @resurrect-save ' '
set -g @resurrect-restore ' '

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Smart pane navigation (with Vim awareness) on Ctrl-h/j/k/l
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Copy-mode-vi bindings for navigation
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# prefix key set to ctrl-t
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

bind-key C-t send-prefix

#### Key bindings

bind-key C-f display-popup -E -w 100% -h 100% "fish ~/.local/bin/tmux-sessionizer.sh"

bind-key "|" split-window -h
bind-key "_" split-window -v

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory
bind o run-shell "open #{pane_current_path}"
bind -r e kill-pane -a

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing panes with <prefix> + Ctrl-h/j/k/l
bind -T prefix C-h resize-pane -L 5
bind -T prefix C-j resize-pane -D 5
bind -T prefix C-k resize-pane -U 5
bind -T prefix C-l resize-pane -R 5

#### basic settings
set-option -g status-justify "left"
set-option -g history-limit 64096
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

if-shell "[ -x ~/.local/bin/update-tmux-colors.sh ]" "run-shell ~/.local/bin/update-tmux-colors.sh"
source ~/.config/tmux/utility.conf
run '~/.tmux/plugins/tpm/tpm'
# Saves and restores (see @resurrect-autosave-interval above). The path option
# is for other readers; resurrect resets it on load, but nothing here relies on it.
bind-key C-s run-shell "$HOME/.config/tmux/scripts/resurrect_save.py"
bind-key C-r run-shell "$HOME/.config/tmux/scripts/resurrect_save.py restore"
set -g @resurrect-save-script-path "$HOME/.config/tmux/scripts/resurrect_save.py"
run-shell "$HOME/.config/tmux/scripts/resurrect_save.py install"


set -g extended-keys on
set -g extended-keys-format csi-u
# Ghostty is configured as xterm-256color; advertise extended-key support.
set -as terminal-features ',xterm-256color:extkeys,xterm-ghostty:extkeys'
