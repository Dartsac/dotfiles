# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Use the terminal's palette instead of tmux 3.8's automatic light/dark theme
# (-q: an older tmux, without the option, skips it).
set -sq theme terminal

# Keep the active window highlight without tmux 3.8's default underline.
set -g window-status-current-style none

# Show Pi's symbol and optional session name, omitting its " - <directory>"
# suffix when the title has one.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m:π*,#{pane_title}},#{?#{==:#{=/-#{e|+:#{w:#{b:pane_current_path}},3}/:pane_title}, - #{b:pane_current_path}},#{=/#{e|-:#{w:pane_title},#{e|+:#{w:#{b:pane_current_path}},3}}/:pane_title},#{pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}'

# Set terminal to support true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*-ghostty:Tc"

# Reduce escape-time for faster command sequence
set -sg escape-time 10

# Enable mouse support
set -g mouse on

# Set scrollback buffer size
set -g history-limit 50000

# Clipboard
set -g set-clipboard on

# plugins, by their full URL: for a short name (user/plugin) TPM first tries a
# URL with an empty password, which git then hands to a credential helper to
# keep (the macOS keychain, ~/.git-credentials).
set -g @plugin 'https://github.com/tmux-plugins/tpm'
set -g @plugin 'https://github.com/tmux-plugins/tmux-sensible'
set -g @plugin 'https://github.com/tmux-plugins/tmux-yank'
# Framed zoom on prefix z. Its 'always' mode, a frame around every pane, needs
# tmux 3.8, Rust and Python: set it in tmux.local.conf (see the example).
set -g @plugin 'https://github.com/Dartsac/tmux-pane-clarity'
set -g @plugin 'https://github.com/tmux-plugins/tmux-resurrect'
set -g @plugin 'https://github.com/tmux-plugins/tmux-continuum'
# Every save and restore goes through scripts/resurrect_save.py, which keeps
# them apart (see there). resurrect binds no keys and continuum's own autosave
# is off: on every config reload both would briefly run resurrect's scripts
# directly. The wrapper autosaves instead, every:
set -g @resurrect-autosave-interval '1'
set -g @continuum-save-interval '0'
set -g @resurrect-save ' '
set -g @resurrect-restore ' '

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Smart pane navigation (with Vim awareness) on Ctrl-h/j/k/l
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Copy-mode-vi bindings for navigation
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# prefix key set to ctrl-t
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

bind-key C-t send-prefix

#### Key bindings

# Pick a project and open or switch to its session (scripts/sessionizer.py).
bind-key C-f display-popup -E -w 100% -h 100% "$HOME/.config/tmux/scripts/sessionizer.py"

bind-key "|" split-window -h
bind-key "_" split-window -v

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open the current directory in the file manager, where xdg-open is installed
# (macos.conf opens Finder instead). Never `open`: on Debian and Ubuntu that is
# openvt.
bind o run-shell -b 'command -v xdg-open >/dev/null && xdg-open #{q:pane_current_path} >/dev/null 2>&1; true'
bind -r e kill-pane -a

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing panes with <prefix> + Ctrl-h/j/k/l
bind -T prefix C-h resize-pane -L 5
bind -T prefix C-j resize-pane -D 5
bind -T prefix C-k resize-pane -U 5
bind -T prefix C-l resize-pane -R 5

#### basic settings
set-option -g status-justify "left"
set-option -g history-limit 64096
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string "#T"

#### Colors: the free Dracula theme
# https://draculatheme.com/contribute#color-palette. The arrows are Powerline
# glyphs, which a Nerd Font (such as Hack Nerd Font) draws. tmux.local.conf
# may set any of these again; theme-sync sets them all there in Dracula PRO,
# from dracula-pro.conf.template, which a change here also needs.
set -g mode-style "fg=#f8f8f2,bg=#6272a4"
set -g message-style "fg=#f8f8f2,bg=#6272a4"
set -g message-command-style "fg=#f8f8f2,bg=#6272a4"
# tmux-pane-clarity sets pane-border-style as it loads, from this option.
set -g @pane_clarity_border_style "fg=#6272a4"
set -g pane-active-border-style "fg=#ff79c6"
set -g status-style "fg=#282a36,bg=#343746"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE
# The session's name turns pink while the prefix is pressed.
set -g status-left "#[fg=#424450,bg=#f8f8f2,bold]#{?client_prefix,#[bg=#ff79c6],} #S #[fg=#f8f8f2,bg=#424450]#{?client_prefix,#[fg=#ff79c6],}#[fg=#f8f8f2,bg=#424450,bold] #(whoami) #[fg=#424450,bg=#343746]"
set -g status-right "#[fg=#282a36,bg=#343746,nobold,nounderscore,noitalics]#[fg=#424450,bg=#282a36]#[fg=#343746,bg=#282a36,nobold,nounderscore,noitalics]#[fg=#424450,bg=#343746]#[fg=#424450,bg=#343746,nobold,nounderscore,noitalics]#[fg=#f8f8f2,bg=#424450,bold] #h "
setw -g window-status-activity-style "underscore,fg=#343746,bg=#343746"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#f8f8f2,bg=#343746"
setw -g window-status-format "#[fg=#343746,bg=#343746]#[default] #I  #{window_name} #[fg=#343746,bg=#343746,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#343746,bg=#f8f8f2]#[fg=#282a36,bg=#f8f8f2,bold] *#I #[fg=#f8f8f2,bg=#bd93f9]#[fg=#282a36,bg=#bd93f9,bold] #{window_name} #[fg=#bd93f9,bg=#343746,nobold]"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"
source ~/.config/tmux/utility.conf

set -g extended-keys on
set -g extended-keys-format csi-u
# Ghostty is configured as xterm-256color; advertise extended-key support.
set -as terminal-features ',xterm-256color:extkeys,xterm-ghostty:extkeys'

# Your own settings, in tmux.local.conf beside this file when it exists. Git
# ignores it; tmux.local.example.conf shows its shape. It comes after every
# setting above, so it wins over them, and before the plugins load, so it can
# set their options too. Only the plugins and the keys that save and restore
# sessions come after it.
source-file -q ~/.config/tmux/tmux.local.conf

# Plugins. TPM, the plugin manager, keeps them in plugins/ beside this file,
# which git ignores. A first start clones TPM there; every start installs any
# plugin listed above that is missing, then TPM loads them all.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if-shell '[ ! -d ~/.config/tmux/plugins/tpm ]' \
    "run-shell 'git clone --quiet https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins >/dev/null'
run-shell '~/.config/tmux/plugins/tpm/tpm'
# Saves and restores (see @resurrect-autosave-interval above). The path option
# is for other readers; resurrect resets it on load, but nothing here relies on it.
bind-key C-s run-shell "$HOME/.config/tmux/scripts/resurrect_save.py"
bind-key C-r run-shell "$HOME/.config/tmux/scripts/resurrect_save.py restore"
set -g @resurrect-save-script-path "$HOME/.config/tmux/scripts/resurrect_save.py"
run-shell "$HOME/.config/tmux/scripts/resurrect_save.py install"
