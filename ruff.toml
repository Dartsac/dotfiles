# Lint for the repository's Python (`ruff check`): names that are unused or
# undefined, and syntax the oldest Python that runs it cannot read. That is
# macOS's own /usr/bin/python3, 3.9. The pre-commit hook runs it on staged
# files where ruff is installed; .github/workflows/lint.yml on every push.
target-version = "py39"
# The root scripts are Python without the suffix.
extend-include = ["theme-sync", "install", "land"]
# Outside the checkout, so a run leaves no folder for git to report.
cache-dir = "~/.cache/ruff"

[lint]
select = ["F", "E9"]
