# Each package .tests/standalone.py covers (`--list`) works alone on a fresh
# machine: the check stows it into an empty home directory and starts its tool.
name: standalone

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the packages' dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install stow direnv eza

      - name: Install the packages' dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow direnv
          # Ubuntu's eza predates theme.yml (0.19.2), so take a release build.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/eza-community/eza/releases/download/v0.23.5/eza_x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ./install
        run: python3 -B .tests/test_install.py -v

      - name: Standalone check
        run: python3 -B .tests/standalone.py
