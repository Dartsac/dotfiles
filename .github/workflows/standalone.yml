# Each package .tests/standalone.py covers (`--list`) works alone on a fresh
# machine: the check stows it into an empty home directory and starts its tool.
name: standalone

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # /usr/bin/python3 is the Python a Mac has without Homebrew (3.9).
          - os: macos-latest
            python: /usr/bin/python3
          # Pinned, so .tests/linux.sh runs this same release locally.
          - os: ubuntu-26.04
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the packages' dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install stow direnv eza lazygit git neovim ripgrep tree-sitter-cli

      - name: Install the packages' dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sh .tests/ubuntu-deps.sh

      - name: ./install
        run: ${{ matrix.python }} -B .tests/test_install.py -v

      - name: Standalone check
        run: ${{ matrix.python }} -B .tests/standalone.py
